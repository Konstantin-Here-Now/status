- date: 2026-08-08 10:00
  title: Временное отсутствие подключения
  text: |
    Вы только что могли наблюдать временное отсутствие подключения: не волнуйтесь, нас не блокируют.
    
    Это я попытался добавить правило на блокировку рекламы в трафике (чтобы вы даже без adblocker её не видели). Получилось неудачно - рекламой оказалось всё, и заблокировалось всё)
    
    Сейчас я это убрал, и всё работает в штатном режиме.


